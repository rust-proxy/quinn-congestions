name: CI

on:
  push:
    branches: [ main, feat/brutal ]
  pull_request:
    branches: [ main, feat/brutal ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check
      - name: Run tests
        run: cargo test --all-targets --all-features
      - name: Run doc tests
        run: cargo test --doc
