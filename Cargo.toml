[package]
name = "quinn-congestions"
version = "0.1.0"
edition = "2024"

[dependencies]
quinn = { branch = "bbrv3", git = "https://github.com/Tipuch/quinn.git" }
quinn-proto = { branch = "bbrv3", git = "https://github.com/Tipuch/quinn.git" }
rand = "0.10"
rand_pcg = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring"] }